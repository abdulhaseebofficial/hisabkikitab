<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f8ff" />
    <meta
      name="description"
      content="Track income and expenses, plan budgets and savings goals, and manage shared household costs with Hisab Ki Kitab."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Hisab Ki Kitab | Expense Tracker &amp; Budget Planner</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes white.
      (function () {
        try {
          var stored = localStorage.getItem('hw-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || (stored !== 'light' && prefersDark);
          if (dark) document.documentElement.classList.add('dark');
          // Paint the paper colour before React mounts so there is no flash.
          document.documentElement.style.backgroundColor = dark ? '#081b4b' : '#f4f8ff';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#081b4b' : '#f4f8ff');
        } catch (e) {
          /* private mode, ignore */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
