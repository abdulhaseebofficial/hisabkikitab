name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Everything that needs no database. Fast, and the first thing to fail on a
  # broken import or a crossed layer.
  static:
    name: Structure, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Check the layering rules
        run: npm run check:boundaries

      - name: Check for shadowed module bindings
        run: npm run check:shadowing

      - name: Check for code nothing reaches
        run: npm run check:dead

      - name: Unit tests
        run: npm run test:unit

      - name: Frontend component tests
        run: npm run test:web

      - name: Production build
        run: npm run build

      # Advisory: a vulnerable transitive dependency should be visible without
      # failing every unrelated pull request over it.
      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # The database-backed half. Runs against a throwaway Postgres, so it needs no
  # secrets and cannot touch anything real.
  integration:
    name: Migrations, database, API and browsers
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hisabkikitab
          POSTGRES_PASSWORD: hisabkikitab
          POSTGRES_DB: hisabkikitab_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://hisabkikitab:hisabkikitab@localhost:5432/hisabkikitab_test
      NODE_ENV: test
      # Not secrets: this database exists for the length of one job.
      JWT_ACCESS_SECRET: ci-access-secret-long-enough-to-pass-validation-000000
      JWT_REFRESH_SECRET: ci-refresh-secret-long-enough-to-pass-validation-00000
      PORT: 5000
      VITE_API_URL: /api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      # Proves the fresh-database path: a schema that does not exist yet ends
      # up complete, and re-applying is harmless.
      - name: Migrate
        run: npm run migrate

      - name: Migration checks
        run: npm run test:migrations

      - name: Seed the demo account the API suite signs in as
        run: npm run seed

      - name: Database constraints and transactions
        run: npm run test:db

      - name: API, settings, debts, shared living and browser suites
        shell: bash
        run: |
          export CLIENT_URL=$(node -p 'require("./scripts/frontend-config").frontendURL')
          node apps/api/server.js > api.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for i in $(seq 1 30); do
            kill -0 "$api_pid" 2>/dev/null || { cat api.log; exit 1; }
            if curl --max-time 2 -sf http://localhost:5000/api/health > /dev/null; then
              ready=true; break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then cat api.log; exit 1; fi
          # Playwright starts, waits for, and stops Vite through webServer.
          npm run test:e2e

      - name: Check generated browser output is ignored by the scanner
        if: always()
        run: npm run check:dead
